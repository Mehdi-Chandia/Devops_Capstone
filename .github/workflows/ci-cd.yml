name: Caostone-CI-CD-pipeline

on:
  push:
    branches:
      - main

jobs:
  check-backend:
    runs-on: ubuntu-latest

    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with: 
            node-version: "24"

      - name: install dependencies
        working-directory: ./app
        run: npm install

  docker:
    runs-on: ubuntu-latest
    needs: check-backend

    steps: 
      - name: get the code
        uses: actions/checkout@v4

      - name: login to docker
        uses: docker/login-action@v3
        with:
         username: ${{secrets.DOCKER_USERNAME}}
         password: ${{secrets.DOCKER_PASSWORD}}

      - name: build and pull the image
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/capstone-backend:latest ./app
          docker push ${{secrets.DOCKER_USERNAME}}/capstone-backend:latest

  terraform:
    runs-on: ubuntu-latest
    needs: docker

    env:
     AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform plan
        working-directory: ./terraform
        run: terraform plan

      - name: Terraform apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

        